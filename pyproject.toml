[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "culture-speech-repro"
version = "0.1.0"
description = "Reference implementation and validation tools for cultural speech semantic modeling"
requires-python = ">=3.10,<3.13"
dependencies = ["torch==2.5.1", "numpy>=1.26,<3", "scipy>=1.11,<2", "librosa==0.10.1", "jieba==0.42.1", "nltk==3.9.1", "rouge-score==0.1.2", "psutil>=5.9,<8"]

[tool.setuptools.packages.find]
where = ["src"]
